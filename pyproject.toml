[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testomatic-runner"
version = "0.2.0"
description = "Test runner that executes a Testomatic Test Suite Package against real hardware via testomatic-io."
readme = "README.md"
authors = [
  {name = "Jonathan Oxer", email = "jon@oxer.com.au"},
  {name = "Elena Williams"}
]
maintainers = [
  {name = "Jonathan Oxer", email = "jon@oxer.com.au"},
  {name = "Elena Williams"}
]
classifiers = [
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "License :: OSI Approved :: MIT License",
]
license = {text = "MIT"}
requires-python = ">=3.11"

[project.scripts]
testomatic = "testomatic.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
# testomatic-io pulls in gpiod (libgpiod's Python bindings), which has a native extension that
# only builds on Linux (needs linux/const.h) -- kept out of core dependencies so `pip install
# -e ".[dev]"` keeps working on a Mac dev machine. Install this extra on the Raspberry Pi itself.
# >=0.1.1 (not yet published, see testomatic-io's own pyproject.toml) because 0.1.0 fails a fresh
# install on current Raspberry Pi OS -- see testomatic-io's BLINKA_REMOVAL_PLAN.md "Motivation".
# esptool is a pure-Python PyPI package (unlike avrdude/openocd/STM32CubeProgrammer, which are
# native tools with no PyPI distribution) and registers an `esptool.py` console script on
# install, so this makes UPLOAD_FIRMWARE_ESPTOOL's default `esptool_path` (see steps/firmware.py)
# resolve without the caller needing to set --esptool-path/context.esptool_path themselves.
pi = ["testomatic-io>=0.1.1", "esptool"]

[project.urls]
Homepage = "https://github.com/SuperHouse/testomatic-runner"
bugs = "https://github.com/SuperHouse/testomatic-runner/issues"

[tool.setuptools.packages.find]
include = ["testomatic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on sys.path during test collection so `import testomatic` works whether or
# not the package is installed.
pythonpath = ["."]
# Suite/step domain types are named Test*/TestRunner (matching Register's own model names);
# without this, pytest tries to collect them as test classes and warns since they have __init__.
python_classes = ["*Tests"]
